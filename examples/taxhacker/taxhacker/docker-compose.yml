services:
  taxhacker:
    image: ghcr.io/vas3k/taxhacker:latest
    container_name: taxhacker
    ports:
      - "7331:7331"
    environment:
      - NODE_ENV=production
      - SELF_HOSTED_MODE=true
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/taxhacker
    volumes:
      - /mnt/drive/data/taxhacker/storage:/app/data
    restart: unless-stopped
    networks:
      - proxy-network
      - taxhacker-local-network
    depends_on:
      - postgres
    logging:
      driver: "local"
      options:
        max-size: "100M"
        max-file: "3"
    labels:
      proxy.http.host: "taxhacker.example.com"
      proxy.http.port: "7331"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    networks:
      - taxhacker-local-network
    logging:
      driver: "local"
      options:
        max-size: "100M"
        max-file: "3"

networks:
  proxy-network:
    name: proxy-network
    external: true
  taxhacker-local-network:
    name: taxhacker-local-network
    driver: bridge